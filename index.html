const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(p,mem){try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
if(mem){try{localStorage.setItem('mig-code',p)}catch(e){}}
document.open();document.write(new TextDecoder().decode(pt));document.close();return true}catch(e){return false}}
(async()=>{let m=null;try{m=localStorage.getItem('mig-code')}catch(e){}if(m&&await ouvrir(m,false))return;})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const ok=await ouvrir(document.getElementById('p').value,true);if(!ok)document.getElementById('e').textContent='Code incorrect, réessayez.';});
